<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Fetch Sample</title>
</head>

<body>

    <nav style="background: #f8f9fa; padding: 15px; margin-bottom: 20px; border-radius: 8px;">
        <a href="/" style="margin-right: 20px; text-decoration: none; color: #007bff;">首页</a>
        <a href="/hello" style="margin-right: 20px; text-decoration: none; color: #007bff;">Hello页面</a>
        <a href="/mib-parser" style="margin-right: 20px; text-decoration: none; color: #007bff; font-weight: bold;">🌳 MIB解析器</a>
    </nav>

    <h1>JavaScript Fetch Sample</h1>

    <form id="form">
        <h2>First Name</h2>
        <input type="text" id="firstname">
        <h2>Last Name</h2>
        <input type="text" id="lastname">
        <button type="button" name="button" onclick="getHello()">Submit</button>
    </form>
    <br>
    <div id="output"></div>
    <script type="text/javascript">
    function getHello() {
        let data = new FormData()
        data.append('firstname', document.getElementById('firstname').value)
        data.append('lastname', document.getElementById('lastname').value)
        fetch("/hello", {"method": "POST", "body": data})
            .then(response => response.json())  
            .then(json => {
                console.log(json);
                document.getElementById("output").innerText = JSON.stringify(json.output)
        })
    }
    </script>
    
</body>
</html>
