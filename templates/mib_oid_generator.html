<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('MIB表OID生成器') }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .main-content {
            padding: 40px;
        }
        
        .workflow-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .input-section, .output-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #e2e8f0;
        }
        
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Courier New', monospace;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-right: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .result-area {
            background: #1f2937;
            color: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        
        .alert.error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }
        
        .alert.success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
        }
        
        .alert.info {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
        }
        
        .help-text {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 6px;
        }
        
        .template-section {
            background: #fef3c7;
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .template-title {
            font-weight: 600;
            color: #92400e;
            margin-bottom: 10px;
        }
        
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .template-card {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 6px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .template-card:hover {
            background: #fef3c7;
            border-color: #f59e0b;
        }
        
        .template-name {
            font-weight: 600;
            color: #78350f;
            margin-bottom: 5px;
        }
        
        .template-desc {
            font-size: 0.85rem;
            color: #92400e;
        }
        
        .oid-result {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .oid-result:hover {
            border-color: #4f46e5;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }
        
        .oid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .oid-name {
            font-weight: 600;
            color: #1f2937;
        }
        
        .oid-value {
            font-family: 'Courier New', monospace;
            background: #f3f4f6;
            padding: 8px 12px;
            border-radius: 4px;
            color: #1f2937;
            font-size: 0.9rem;
        }
        
        .copy-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        
        .copy-btn:hover {
            background: #059669;
        }
        
        .advanced-options {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .advanced-title {
            font-weight: 600;
            color: #475569;
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .workflow-section {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <h1>🎯 {{ _('MIB表OID生成器') }}</h1>
                    <p>{{ _('针对特殊MIB表，根据用户选项智能生成对应的OID') }}</p>
                </div>
                <a href="/" style="background: rgba(255,255,255,0.2); color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 500; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;">
                    <span>←</span>
                    <span>{{ _('返回主页') }}</span>
                </a>
            </div>
        </div>
        
        <div class="main-content">
            <div class="workflow-section">
                <!-- 输入区域 -->
                <div class="input-section">
                    <h2 class="section-title">
                        <span>📝</span>
                        <span>配置选项</span>
                    </h2>
                    
                    <div class="form-group">
                        <label for="device_type">设备类型</label>
                        <select id="device_type" onchange="loadDeviceTables()">
                            <option value="">请选择设备类型</option>
                        </select>
                        <div class="help-text">选择设备类型以加载对应的MIB表</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="table_name">MIB表名称</label>
                        <select id="table_name" onchange="updateTableInfo()">
                            <option value="">请先选择设备类型</option>
                        </select>
                        <div class="help-text">选择要生成OID的MIB表</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="table_info">表信息</label>
                        <textarea id="table_info" readonly style="background: #f8fafc; min-height: 80px;" placeholder="选择表后显示详细信息"></textarea>
                        <div class="help-text">表的基础OID和描述信息</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="index_values">索引值</label>
                        <textarea id="index_values" placeholder="输入索引值，每行一个&#10;例如:&#10;1&#10;2&#10;10&#10;或者:&#10;192.168.1.1&#10;10.0.0.1"></textarea>
                        <div class="help-text" id="index_help">输入表的索引值，支持数字和IP地址格式</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="column_select">选择列</label>
                        <select id="column_select" multiple style="height: 120px;">
                            <option value="all">所有列</option>
                        </select>
                        <div class="help-text" id="column_help">选择要生成OID的列，按住Ctrl多选</div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="output_format">输出格式</label>
                            <select id="output_format">
                                <option value="oid">纯OID</option>
                                <option value="snmpget">snmpget命令</option>
                                <option value="snmpwalk">snmpwalk命令</option>
                                <option value="table">表格格式</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="target_ip">目标IP (可选)</label>
                            <input type="text" id="target_ip" placeholder="192.168.1.1">
                            <div class="help-text">生成命令时需要</div>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 10px;">
                        <button class="btn" onclick="generateOIDs()">生成OID</button>
                        <button class="btn btn-secondary" onclick="clearForm()">清空</button>
                        <button class="btn btn-success" onclick="exportResults()">导出结果</button>
                    </div>
                </div>
                
                <!-- 输出区域 -->
                <div class="output-section">
                    <h2 class="section-title">
                        <span>📋</span>
                        <span>生成结果</span>
                    </h2>
                    
                    <div id="results_container">
                        <div class="result-area" id="results">
                            生成的OID将在这里显示...
                        </div>
                    </div>
                    
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <button class="copy-btn" onclick="copyAllResults()">复制全部</button>
                        <button class="copy-btn" onclick="clearResults()">清空结果</button>
                    </div>
                </div>
            </div>
            
            <!-- 模板区域 -->
            <div class="template-section">
                <div class="template-title">🎯 快速模板</div>
                <div class="help-text">点击模板快速填充常用配置</div>
                
                <div class="template-grid" id="template_grid">
                    <!-- 模板将通过JavaScript动态加载 -->
                    <div class="template-card">
                        <div class="template-name">加载中...</div>
                        <div class="template-desc">正在获取模板</div>
                    </div>
                </div>
            </div>
            
            <!-- 高级选项 -->
            <div class="advanced-options">
                <div class="advanced-title">⚙️ 高级选项</div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="community">Community字符串</label>
                        <input type="text" id="community" value="public">
                    </div>
                    
                    <div class="form-group">
                        <label for="snmp_version">SNMP版本</label>
                        <select id="snmp_version">
                            <option value="1">SNMPv1</option>
                            <option value="2c" selected>SNMPv2c</option>
                            <option value="3">SNMPv3</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="custom_columns">自定义列名</label>
                    <input type="text" id="custom_columns" placeholder="例如: ifDescr, ifOperStatus, ifInOctets">
                    <div class="help-text">用逗号分隔多个列名，用于自定义表类型</div>
                </div>
            </div>
            
            <div class="alert" id="alert"></div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentTables = [];
        let currentTemplates = [];
        let currentTableInfo = null;
        
        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadDeviceTypes();
            loadTemplates();
            
            // 添加回车键支持
            document.getElementById('index_values').addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') {
                    generateOIDs();
                }
            });
        });
        
        // 加载设备类型
        async function loadDeviceTypes() {
            try {
                console.log('开始加载设备类型');
                const response = await fetch('/api/device-types');
                const result = await response.json();
                
                console.log('设备类型API响应:', result);
                
                if (result.success) {
                    const select = document.getElementById('device_type');
                    select.innerHTML = '<option value="">请选择设备类型</option>';
                    
                    console.log('设备类型数量:', result.data.length);
                    
                    result.data.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.id;
                        option.textContent = `${device.name} (${device.description})`;
                        select.appendChild(option);
                        
                        if (index < 3) {
                            console.log(`设备 ${index + 1}:`, device);
                        }
                    });
                    
                    console.log('设备类型选择器选项数量:', select.options.length);
                    console.log('设备类型加载完成');
                } else {
                    console.error('设备类型API返回失败:', result);
                    showAlert('加载设备类型失败', 'error');
                }
            } catch (error) {
                console.error('加载设备类型失败:', error);
                showAlert('加载设备类型失败', 'error');
            }
        }
        
        // 加载设备的MIB表
        async function loadDeviceTables() {
            const deviceType = document.getElementById('device_type').value;
            const tableSelect = document.getElementById('table_name');
            
            // 重置表选择
            tableSelect.innerHTML = '<option value="">请选择MIB表</option>';
            document.getElementById('table_info').value = '';
            document.getElementById('column_select').innerHTML = '<option value="all">所有列</option>';
            
            if (!deviceType) {
                return;
            }
            
            try {
                console.log('正在加载设备表:', deviceType);
                const response = await fetch(`/api/device-types/${deviceType}/mib-tables`);
                const result = await response.json();
                
                console.log('API响应:', result);
                
                if (result.success) {
                    currentTables = result.data.tables;
                    console.log('加载的表数量:', currentTables.length);
                    console.log('前5个表:', currentTables.slice(0, 5));
                    
                    try {
                        console.log('开始添加表选项，表数量:', result.data.tables.length);
                        console.log('表选择器当前选项数量:', tableSelect.options.length);
                        
                        result.data.tables.forEach((table, index) => {
                            const option = document.createElement('option');
                            option.value = table.name;
                            option.textContent = `${table.name} - ${table.description}`;
                            console.log(`创建选项 ${index + 1}:`, option.value, option.textContent);
                            tableSelect.appendChild(option);
                            console.log(`选项 ${index + 1} 已添加，当前选项数量:`, tableSelect.options.length);
                            
                            // 只记录前5个表的详细信息
                            if (index < 5) {
                                console.log(`表 ${index + 1}:`, table);
                            }
                        });
                        
                        console.log('表选择器最终选项数量:', tableSelect.options.length);
                        console.log('添加选项完成');
                        
                        // 检查是否成功添加了选项
                        if (tableSelect.options.length <= 1) {
                            console.error('表选项添加失败，选项数量:', tableSelect.options.length);
                        } else {
                            console.log('表选项添加成功，第一个选项:', tableSelect.options[1].textContent);
                        }
                    } catch (error) {
                        console.error('添加表选项时出错:', error);
                    }
                } else {
                    showAlert(result.error || '加载MIB表失败', 'error');
                }
            } catch (error) {
                console.error('加载MIB表失败:', error);
                showAlert('加载MIB表失败', 'error');
            }
        }
        
        // 更新表信息
        function updateTableInfo() {
            console.log('updateTableInfo 被调用');
            const tableName = document.getElementById('table_name').value;
            console.log('选中的表名:', tableName);
            const tableInfo = document.getElementById('table_info');
            const columnSelect = document.getElementById('column_select');
            const indexHelp = document.getElementById('index_help');
            const columnHelp = document.getElementById('column_help');
            
            // 重置列选择
            columnSelect.innerHTML = '<option value="all">所有列</option>';
            
            if (!tableName) {
                console.log('没有选择表名');
                tableInfo.value = '';
                indexHelp.textContent = '输入表的索引值，支持数字和IP地址格式';
                columnHelp.textContent = '选择要生成OID的列，按住Ctrl多选';
                return;
            }
            
            console.log('当前表数量:', currentTables.length);
            
            // 查找表信息
            const table = currentTables.find(t => t.name === tableName);
            console.log('找到的表:', table);
            
            if (!table) {
                console.log('未找到表信息');
                tableInfo.value = '未找到表信息';
                return;
            }
            
            currentTableInfo = table;
            
            // 显示表信息
            tableInfo.value = `表名: ${table.name}\nOID: ${table.oid}\n描述: ${table.description}\n类型: ${table.type}`;
            console.log('表信息已更新:', tableInfo.value);
            
            // 更新索引帮助信息
            if (table.index_columns && table.index_columns.length > 0) {
                const indexDesc = table.index_columns.map(idx =>
                    `${idx.name} (${idx.type})`
                ).join(', ');
                indexHelp.textContent = `索引列: ${indexDesc}`;
            }
            
            // 更新列帮助信息
            if (table.columns && table.columns.length > 0) {
                columnHelp.textContent = `共${table.columns.length}列可选`;
                console.log('表列数量:', table.columns.length);
                
                // 添加列选项
                table.columns.forEach((column, index) => {
                    if (index < 5) {  // 只记录前5列
                        console.log(`列 ${index + 1}:`, column);
                    }
                    const option = document.createElement('option');
                    option.value = column.name;
                    option.textContent = `${column.name} - ${column.description}`;
                    columnSelect.appendChild(option);
                });
                console.log('列选择器选项数量:', columnSelect.options.length);
                console.log('列选项添加完成');
            } else {
                console.log('表没有列信息');
            }
        }
        
        // 加载模板
        async function loadTemplates() {
            try {
                const response = await fetch('/api/oid-generator/templates');
                const result = await response.json();
                
                if (result.success) {
                    currentTemplates = result.data.templates;
                    displayTemplates();
                }
            } catch (error) {
                console.error('加载模板失败:', error);
            }
        }
        
        // 显示模板
        function displayTemplates() {
            const templateGrid = document.getElementById('template_grid');
            templateGrid.innerHTML = '';
            
            Object.keys(currentTemplates).forEach(templateId => {
                const template = currentTemplates[templateId];
                const card = document.createElement('div');
                card.className = 'template-card';
                card.onclick = () => loadTemplate(templateId);
                
                card.innerHTML = `
                    <div class="template-name">${template.name}</div>
                    <div class="template-desc">${template.description}</div>
                `;
                
                templateGrid.appendChild(card);
            });
        }
        
        // 加载模板
        async function loadTemplate(templateId) {
            const template = currentTemplates[templateId];
            if (!template) return;
            
            // 设置设备类型和表
            if (template.device_type) {
                document.getElementById('device_type').value = template.device_type;
                await loadDeviceTables();
                
                if (template.table_name) {
                    document.getElementById('table_name').value = template.table_name;
                    updateTableInfo();
                }
            }
            
            // 设置索引值
            if (template.index_values) {
                document.getElementById('index_values').value = template.index_values;
            }
            
            // 选择列
            if (template.columns && currentTableInfo) {
                const columnSelect = document.getElementById('column_select');
                Array.from(columnSelect.options).forEach(option => {
                    option.selected = template.columns.includes(option.value);
                });
            }
            
            // 设置输出格式
            if (template.output_format) {
                document.getElementById('output_format').value = template.output_format;
            }
            
            showAlert(`已加载模板: ${template.name}`, 'success');
        }
        
        
        // 生成OID
        async function generateOIDs() {
            const deviceType = document.getElementById('device_type').value;
            const tableName = document.getElementById('table_name').value;
            const indexValues = document.getElementById('index_values').value.trim();
            const outputFormat = document.getElementById('output_format').value;
            const targetIp = document.getElementById('target_ip').value.trim();
            const community = document.getElementById('community').value.trim();
            const snmpVersion = document.getElementById('snmp_version').value;
            
            // 验证输入
            if (!deviceType) {
                showAlert('请选择设备类型', 'error');
                return;
            }
            
            if (!tableName) {
                showAlert('请选择MIB表', 'error');
                return;
            }
            
            if (!indexValues) {
                showAlert('请输入索引值', 'error');
                return;
            }
            
            // 获取选中的列
            const columnSelect = document.getElementById('column_select');
            const selectedColumns = Array.from(columnSelect.selectedOptions)
                .map(option => option.value)
                .filter(value => value !== 'all');
            
            if (selectedColumns.length === 0) {
                showAlert('请至少选择一列', 'error');
                return;
            }
            
            // 解析索引值
            const indices = indexValues.split('\n').map(index => index.trim()).filter(index => index);
            
            try {
                // 构建请求数据
                const requestData = {
                    device_id: deviceType,
                    table_name: tableName,
                    index_values: indices,
                    selected_columns: selectedColumns,
                    output_format: outputFormat,
                    target_ip: targetIp || '192.168.1.100',
                    community: community || 'public',
                    snmp_version: snmpVersion || '2c'
                };
                
                // 发送请求
                const response = await fetch('/api/oid-generator/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayGeneratedResults(result.data.generated_oids);
                    showAlert(`成功生成 ${result.data.generated_oids.length} 个OID`, 'success');
                } else {
                    showAlert(result.error || '生成OID失败', 'error');
                }
            } catch (error) {
                console.error('生成OID失败:', error);
                showAlert('生成OID失败: ' + error.message, 'error');
            }
        }
        
        // 显示生成的结果
        function displayGeneratedResults(results) {
            const resultsDiv = document.getElementById('results');
            const outputFormat = document.getElementById('output_format').value;
            
            if (outputFormat === 'table') {
                let content = '列名\tOID\t格式\n';
                content += '----\t---\t----\n';
                results.forEach(result => {
                    content += `${result.column_name}\t${result.oid}\t${result.format}\n`;
                });
                resultsDiv.textContent = content;
            } else {
                resultsDiv.innerHTML = '';
                results.forEach(result => {
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'oid-result';
                    
                    let content = `
                        <div class="oid-header">
                            <span class="oid-name">${result.column_name}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${result.oid}')">复制</button>
                        </div>
                        <div class="oid-value">${result.oid}</div>
                    `;
                    
                    if (result.command) {
                        content += `<div style="margin-top: 8px; font-size: 0.85rem; color: #6b7280;">${result.command}</div>`;
                    }
                    
                    resultDiv.innerHTML = content;
                    resultsDiv.appendChild(resultDiv);
                });
            }
        }
        
        // 复制到剪贴板
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showAlert('已复制到剪贴板', 'success');
            }).catch(() => {
                showAlert('复制失败', 'error');
            });
        }
        
        // 显示结果
        function displayResults(results) {
            const resultsDiv = document.getElementById('results');
            if (document.getElementById('output_format').value === 'table') {
                resultsDiv.textContent = '列名\tOID\n' + results.join('\n');
            } else {
                resultsDiv.textContent = results.join('\n');
            }
        }
        
        // 复制所有结果
        function copyAllResults() {
            const results = document.getElementById('results').textContent;
            navigator.clipboard.writeText(results).then(() => {
                showAlert('结果已复制到剪贴板', 'success');
            }).catch(() => {
                showAlert('复制失败，请手动复制', 'error');
            });
        }
        
        // 清空表单
        function clearForm() {
            document.getElementById('device_type').value = '';
            document.getElementById('table_name').value = '';
            document.getElementById('table_info').value = '';
            document.getElementById('index_values').value = '';
            document.getElementById('column_select').innerHTML = '<option value="all">所有列</option>';
            document.getElementById('output_format').value = 'oid';
            document.getElementById('target_ip').value = '';
            document.getElementById('results').innerHTML = '生成的OID将在这里显示...';
            document.getElementById('index_help').textContent = '输入表的索引值，支持数字和IP地址格式';
            document.getElementById('column_help').textContent = '选择要生成OID的列，按住Ctrl多选';
            currentTableInfo = null;
        }
        
        // 清空结果
        function clearResults() {
            document.getElementById('results').innerHTML = '生成的OID将在这里显示...';
        }
        
        // 导出结果
        function exportResults() {
            const results = document.getElementById('results');
            const resultsText = results.textContent || results.innerText;
            
            if (!resultsText || resultsText === '生成的OID将在这里显示...') {
                showAlert('没有可导出的结果', 'error');
                return;
            }
            
            const blob = new Blob([resultsText], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'oid_results.txt';
            a.click();
            window.URL.revokeObjectURL(url);
            
            showAlert('结果已导出', 'success');
        }
        
        // 显示提示
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 3000);
            }
        }
        
    </script>
</body>
</html>
