<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Form Sample</title>
</head>

<body>

    <nav style="background: #f8f9fa; padding: 15px; margin-bottom: 20px; border-radius: 8px;">
        <a href="/" style="margin-right: 20px; text-decoration: none; color: #007bff;">首页</a>
        <a href="/mib-parser" style="margin-right: 20px; text-decoration: none; color: #007bff; font-weight: bold;">🌳 MIB解析器</a>
    </nav>

    <h1>AJAX Form Sample</h1>

    <form id="form">
        <h2>First Name</h2>
        <input type="text" id="firstname">
        <h2>Last Name</h2>
        <input type="text" id="lastname">
        <button type="submit" name="button">Submit</button>
    </form>
    
    <div id="output"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script type="text/javascript">
    $(document).ready(function() {
        $('#form').on('submit',function(e){
            $.ajax({
            data : {
                firstname : $('#firstname').val(),
                lastname : $('#lastname').val(),
            },
            type : 'POST',
            url : '/'
            })
            .done(function(data){
            $('#output').text(data.output).show();
            });
            e.preventDefault();
        });
    });
    </script>
    
</body>
</html>
